<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASA Team Chile - Portal Interno</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #0070f3;
            color: white;
            text-align: center;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 0.5px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* Tarjetas contenedoras (Login y Botonera) */
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #222;
            font-size: 20px;
            text-align: center;
        }
        /* Inputs estilizados */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0070f3;
        }
        /* Botones estilo ASA (Azules, modernos y limpios) */
        .btn-asa {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-asa:hover {
            background-color: #0051bb;
        }
        .btn-asa:active {
            transform: scale(0.98);
        }
        /* Botón rojo para cerrar visores */
        .btn-danger {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-danger:hover {
            background-color: #bd2130;
        }
        /* Mensaje de error */
        #mensajeError {
            color: #dc3545;
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        footer {
            background-color: #222;
            color: #bbb;
            text-align: center;
            padding: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ASA Team Chile</h1>
    </header>

    <main>
        <section id="seccion-login" class="card">
            <h2>Control de Acceso</h2>
            
            <div class="form-group">
                <label for="inputUsuario">Usuario</label>
                <input type="text" id="inputUsuario" placeholder="Ingrese su usuario">
            </div>
            
            <div class="form-group">
                <label for="inputClave">Contraseña</label>
                <input type="password" id="inputClave" placeholder="••••••••">
            </div>
            
            <button id="btnIngresar" class="btn-asa">Ingresar</button>
            <p id="mensajeError"></p>
        </section>

        <section id="contenido" class="card" style="display: none; max-width: 500px;">
            <h2>Panel de Herramientas</h2>
            
            <a href="https://forms.gle/r4V3gwWJrKAiRNLx8" target="_blank" style="text-decoration: none;">
                <button id="btnBodega" class="btn-asa">Ingreso / Egreso Bodega</button>
            </a>

            <button id="btnInventario" class="btn-asa">Archivo Maestro Inventario</button>

            <div id="contenedorPDF" style="display:none; margin-bottom: 15px; border: 2px solid #0070f3; border-radius: 8px; overflow: hidden;">
                <iframe src="STOCK.pdf" width="100%" height="450px" style="border: none;"></iframe>
                <div style="text-align: center; padding: 10px; background-color: #f4f4f4;">
                    <button onclick="cerrarVisor()" class="btn-danger">Cerrar Visor</button>
                </div>
            </div>

            <button id="btnReportes" class="btn-asa">Plan Anual</button>

            <div id="contenedorPlan" style="display:none; margin-bottom: 15px; border: 2px solid #0070f3; border-radius: 8px; overflow: hidden;">
                <iframe src="PLAN.pdf" width="100%" height="450px" style="border: none;"></iframe>
                <div style="text-align: center; padding: 10px; background-color: #f4f4f4;">
                    <button onclick="cerrarPlan()" class="btn-danger">Cerrar Visor</button>
                </div>
            </div>

            <button id="btnConfig" class="btn-asa">Catalogos/Manuales</button>
        </section>
    </main>

    <footer>
        <p>Developed exclusively for ASA AUTOMATION SpA | &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
