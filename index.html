<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASA Team Chile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #0070f3;
            color: white;
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        header img {
            max-height: 80px;
            display: block;
            margin: 0 auto 10px auto;
        }
        main {
            padding: 20px;
        }
        button {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 15px auto;
            padding: 15px;
            font-size: 18px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0051bb;
        }
        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
            padding-bottom: 20px;
        }
        .exclusivo-texto {
            margin-top: 20px;
            margin-bottom: 5px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <header>
        <img src="LOGO ASA JPG.jpg" alt="Logo ASA">
        <h1>ASA Team Chile</h1>
    </header>

    <main>
        <section id="seccion-login" style="max-width: 350px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9; text-align: center;">
            <h2 style="margin-bottom: 20px; color: #333; font-size: 20px;">Control de Acceso</h2>
            
            <div style="margin-bottom: 15px; text-align: left;">
                <label for="inputUsuario" style="display: block; margin-bottom: 5px; font-weight: bold;">Usuario:</label>
                <input type="text" id="inputUsuario" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <div style="margin-bottom: 20px; text-align: left;">
                <label for="inputClave" style="display: block; margin-bottom: 5px; font-weight: bold;">Contraseña:</label>
                <input type="password" id="inputClave" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <button id="btnIngresar" style="width: 100%; padding: 10px; background-color: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin: 0;">Ingresar</button>
            
            <p id="mensajeError" style="color: #dc3545; margin-top: 15px; display: none; font-weight: bold;"></p>
        </section>

        <section id="contenido" style="display: none;">
            
            <div class="exclusivo-texto">Developed exclusively for ASA AUTOMATION SpA</div>
            
            <a href="https://forms.gle/r4V3gwWJrKAiRNLx8" target="_blank" style="text-decoration: none;">
                <button id="btnBodega">Ingreso / Egreso Bodega</button>
            </a>

            <button id="btnInventario">Archivo Maestro Inventario</button>

            <div id="contenedorPDF" style="display:none; margin-top: 20px; border: 2px solid #0070f3; border-radius: 8px; overflow: hidden;">
                <iframe src="STOCK.pdf" width="100%" height="700px" style="border: none;"></iframe>
                <div style="text-align: center; padding: 10px; background-color: #f4f4f4;">
                    <button onclick="cerrarVisor()" style="background-color: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; max-width: 200px; margin: 0 auto;">Cerrar Visor</button>
                </div>
            </div>

            <button id="btnReportes">Plan Anual</button>

            <div id="contenedorPlan" style="display:none; margin-top: 20px; border: 2px solid #0070f3; border-radius: 8px; overflow: hidden;">
                <iframe src="PLAN.pdf" width="100%" height="600px" style="border: none;"></iframe>
                <div style="text-align: center; padding: 10px; background-color: #f4f4f4;">
                    <button onclick="cerrarPlan()" style="background-color: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; max-width: 200px; margin: 0 auto;">Cerrar Visor</button>
                </div>
            </div>

            <button id="btnConfig">Catalogos/Manuales</button>
             
        </section>
    </main>

    <footer>
        <p>&copy; E y V solutions</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
